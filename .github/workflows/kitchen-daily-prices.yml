name: Daily kitchen prices
on:
  schedule:
    - cron: '30 22 * * *' # 04:00 IST
    - cron: '50 22 * * *' # 04:20 IST backup
    - cron: '20 23 * * *' # 04:50 IST backup
    - cron: '17 * * * *' # Hourly catch-up if the daily run was missed
  workflow_dispatch:
  push:
    branches: [ReadReseachPaper]
    paths: [.github/workflows/kitchen-daily-prices.yml]
permissions:
  contents: write
  pages: write
concurrency:
  group: kitchen-daily-prices
  cancel-in-progress: false
jobs:
  due:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      refresh: ${{ steps.check.outputs.refresh }}
    steps:
      - name: Check whether today's update is due
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const fmt = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Kolkata', year:'numeric',month:'2-digit',day:'2-digit'});
          const day = fmt.format(new Date());
          const hour = Number(new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Kolkata',hour:'2-digit',hourCycle:'h23'}).format(new Date()));
          let due = process.env.EVENT_NAME !== 'schedule';
          if (process.env.EVENT_NAME === 'schedule' && hour >= 4) {
            try {
              const response = await fetch('https://raw.githubusercontent.com/SathishkumarKandappan/ProjectPublic/gh-pages/kitchen/update-status.json?t=' + Date.now(), {signal:AbortSignal.timeout(15000)});
              if (!response.ok) throw Error('Status unavailable');
              const status = await response.json();
              const checked = new Date(status.checkedAt);
              due = Number.isNaN(checked.getTime()) || fmt.format(checked) !== day || status.retailers?.unattempted > 0 || (status.marketErrors || []).length > 0;
            } catch { due = true; }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'refresh=' + due + '\n');
          console.log(due ? 'Daily update due: starting collection.' : 'Already checked today, or before 04:00 IST: no duplicate collection.');
          JS
  refresh:
    needs: due
    if: needs.due.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Check out kitchen source
        uses: actions/checkout@v4
        with:
          ref: feat/bangalore-kitchen-budget
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out published site and history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Check public source response formats
        if: github.event_name != 'schedule'
        run: node source/kitchen/scripts/check-price-sources.mjs
      - name: Refresh dated market prices
        run: python source/kitchen/scripts/update_prices.py published/kitchen/market.json
      - name: Add government benchmarks and configured free APIs
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          REWALTO_API_KEY: ${{ secrets.REWALTO_API_KEY }}
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node source/kitchen/scripts/update-api-prices.mjs published/kitchen
      - name: Publish market and API updates before the longer retailer search
        working-directory: published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kitchen/market.json kitchen/retailer-prices.json kitchen/update-status.json kitchen/api-status.json kitchen/api-usage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh government and configured API price sources'
            git push origin HEAD:gh-pages
          fi
      - name: Rebuild Pages with market and API updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Search retailer prices and retain history
        run: node source/kitchen/scripts/daily-retailer-prices.mjs published/kitchen
      - name: Publish public price files
        working-directory: published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kitchen/market.json kitchen/retailer-prices.json kitchen/update-status.json kitchen/api-status.json kitchen/api-usage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dated kitchen price observations'
            git push origin HEAD:gh-pages
          fi
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
