<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen prices</title><link rel="stylesheet" href="style.css?v=31"></head><body><main>
<label class="date">Date <input type="date" id="priceDate" aria-label="Price date"></label><span id="refreshStatus" role="status" aria-live="polite"></span><p id="error" role="status" hidden></p>
<label class="search">Search <input type="search" id="dishSearch" placeholder="Dish, ingredient or place — e.g. chole, potato, Kerala" aria-label="Search dishes and ingredients" autocomplete="off"></label>
<div class="tabs" role="tablist" aria-label="Kitchen"><button id="tab-price" data-type="Price" role="tab" aria-controls="pricePanel" aria-selected="true" class="active">Price</button><button id="tab-curry" data-type="Curry" role="tab" aria-controls="dishList" aria-selected="false" tabindex="-1">Curry</button><button id="tab-palya" data-type="Palya" role="tab" aria-controls="dishList" aria-selected="false" tabindex="-1">Palya</button><button id="tab-snack" data-type="Snack" role="tab" aria-controls="dishList" aria-selected="false" tabindex="-1">Snacks</button><button id="tab-creative" data-type="Creative" role="tab" aria-controls="creativeList" aria-selected="false" tabindex="-1">Creative Corner</button><button id="tab-world-curry" data-type="International Curry/Main Course" role="tab" aria-controls="dishList" aria-selected="false" tabindex="-1">International Curry/Main Course</button><button id="tab-world-palya" data-type="International Palya" role="tab" aria-controls="dishList" aria-selected="false" tabindex="-1">International Palya</button><button id="tab-world-snack" data-type="International Snacks" role="tab" aria-controls="dishList" aria-selected="false" tabindex="-1">International Snacks</button><button id="tab-meal-indian" data-type="MealIndian" role="tab" aria-controls="mealList" aria-selected="false" tabindex="-1">Indian Meal Packages</button><button id="tab-meal-fusion" data-type="MealFusion" role="tab" aria-controls="mealList" aria-selected="false" tabindex="-1">Indian–International Fusion</button><button id="tab-reference" data-type="Reference" role="tab" aria-controls="dishList" aria-selected="false" tabindex="-1">Old Menu Reference</button></div>
<div id="searchResults" role="region" aria-label="Dish search results" hidden></div>
<div id="pricePanel" role="tabpanel" aria-labelledby="tab-price"><div class="price-list"><table><thead><tr><th>Ingredient</th><th>Market price</th><th>Supplier price</th><th>Blinkit</th><th>BigBasket</th><th>Instamart</th><th>Online reference</th></tr></thead><tbody id="priceRows"></tbody></table></div></div>
<div id="dishList" role="tabpanel" aria-labelledby="tab-curry" hidden></div><div id="mealList" role="tabpanel" aria-labelledby="tab-meal-indian" hidden></div><div id="creativeList" role="tabpanel" aria-labelledby="tab-creative" hidden></div></main><script type="module" src="app.js?v=31"></script></body></html>
